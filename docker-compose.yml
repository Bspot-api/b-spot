version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: b-spot-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-b_spot}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    container_name: b-spot-maildev
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${SMTP_PORT_WEB:-1080}:1080'

volumes:
  postgres_data:
    driver: local
